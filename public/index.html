<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A vanilla JavaScript authentication starter." />
    <title>Auth Starter</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="app-loading">
    <main class="page-shell">
      <section class="auth-card" id="auth-card" aria-labelledby="auth-title">
        <div class="brand-mark" aria-hidden="true">A</div>
        <p class="eyebrow">Authentication starter</p>
        <h1 id="auth-title">Welcome back</h1>
        <p class="intro" id="auth-intro">Log in to continue to your dashboard.</p>

        <form id="login-form" novalidate>
          <label for="login-username">Username</label>
          <input id="login-username" name="username" type="text" autocomplete="username"
            minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" required />

          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password"
            autocomplete="current-password" minlength="8" required />

          <button class="primary-button" type="submit">Log In</button>
          <p class="form-message" id="login-message" role="status" aria-live="polite"></p>
        </form>

        <form id="register-form" hidden novalidate>
          <label for="register-username">Username</label>
          <input id="register-username" name="username" type="text" autocomplete="username"
            minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" required />

          <label for="register-password">Password</label>
          <input id="register-password" name="password" type="password"
            autocomplete="new-password" minlength="8" required />
          <p class="field-hint">Use at least 8 characters.</p>

          <button class="primary-button" type="submit">Create Account</button>
          <p class="form-message" id="register-message" role="status" aria-live="polite"></p>
        </form>

        <p class="switch-prompt" id="switch-to-register">
          New here? <button class="text-button" type="button">Create an account</button>
        </p>
        <p class="switch-prompt" id="switch-to-login" hidden>
          Already have an account? <button class="text-button" type="button">Log in</button>
        </p>
      </section>

      <section class="welcome-screen" id="welcome-screen" hidden aria-labelledby="welcome-title">
        <div class="welcome-icon" aria-hidden="true">✓</div>
        <p class="eyebrow">Authenticated</p>
        <h1 id="welcome-title">Welcome, <span id="welcome-username"></span>!</h1>
        <p class="intro">You have successfully logged in.</p>
        <button class="secondary-button" id="logout-button" type="button">Log Out</button>
      </section>
    </main>

    <script src="/script.js" defer></script>
  </body>
</html>
